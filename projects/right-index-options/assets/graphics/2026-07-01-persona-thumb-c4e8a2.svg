<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 4800 2700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-blue" x="-25%" y="-18%" width="160%" height="150%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="50" result="blur"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="#0b64dd" flood-opacity="0.65"/>
      <feComposite in2="offsetblur" operator="in" result="glow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur2"/>
      <feOffset dx="4" dy="8" result="shadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.7"/>
      <feComposite in2="shadow" operator="in" result="darkshadow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="darkshadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow-teal" x="-22%" y="-15%" width="155%" height="145%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="55" result="blur"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="#48efcf" flood-opacity="0.6"/>
      <feComposite in2="offsetblur" operator="in" result="glow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur2"/>
      <feOffset dx="4" dy="8" result="shadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.7"/>
      <feComposite in2="shadow" operator="in" result="darkshadow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="darkshadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow-yellow" x="-25%" y="-18%" width="160%" height="150%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="50" result="blur"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="#fec514" flood-opacity="0.55"/>
      <feComposite in2="offsetblur" operator="in" result="glow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur2"/>
      <feOffset dx="4" dy="8" result="shadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.7"/>
      <feComposite in2="shadow" operator="in" result="darkshadow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="darkshadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="diamond-glow" x="-50%" y="-50%" width="200%" height="200%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="censor-blur" x="-10%" y="-20%" width="120%" height="140%" filterUnits="objectBoundingBox">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="light-spill" x="-50%" y="-50%" width="200%" height="200%" filterUnits="objectBoundingBox">
      <feGaussianBlur stdDeviation="140"/>
    </filter>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#181d2a"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="4800" height="2700" fill="url(#bg-glow)"/>
  <rect width="4800" height="2700" fill="url(#grid)"/>

  <!-- Background colored light spills -->
  <ellipse cx="650" cy="1350" rx="700" ry="900" fill="#0b64dd" opacity="0.09" filter="url(#light-spill)"/>
  <ellipse cx="2400" cy="1250" rx="800" ry="1000" fill="#48efcf" opacity="0.07" filter="url(#light-spill)"/>
  <ellipse cx="4150" cy="1350" rx="700" ry="900" fill="#fec514" opacity="0.08" filter="url(#light-spill)"/>

  <!-- Decorative edge lines -->
  <line x1="0" y1="580" x2="420" y2="580" stroke="#0b64dd" stroke-width="6" opacity="0.4"/>
  <line x1="0" y1="608" x2="260" y2="608" stroke="#0b64dd" stroke-width="4" opacity="0.25"/>
  <line x1="4380" y1="580" x2="4800" y2="580" stroke="#fec514" stroke-width="6" opacity="0.4"/>
  <line x1="4540" y1="608" x2="4800" y2="608" stroke="#fec514" stroke-width="4" opacity="0.25"/>

  <!-- Large "?" watermark -->
  <text x="3400" y="2500" font-family="Inter, system-ui, sans-serif" font-size="2600" font-weight="900" fill="#ffffff" opacity="0.025">?</text>

  <!--
    Side cards: y=600, height bleed to ~2900 (200 past bottom)
    Center card: y=340, height bleed to ~3040 (340 past bottom)
    Content spreads to fill the visible area (up to y=2700).
  -->

  <!-- ==================== CARD: CORA (Blue) — left, BEHIND ==================== -->
  <g id="card-cora">
    <rect x="60" y="600" width="1500" height="2300" rx="28" fill="#ffffff" stroke="#0b64dd" stroke-width="14" filter="url(#shadow-blue)"/>

    <!-- Header band -->
    <clipPath id="clip-header-cora">
      <rect x="60" y="600" width="1500" height="175" rx="28"/>
    </clipPath>
    <rect x="60" y="600" width="1500" height="175" fill="#0b64dd" clip-path="url(#clip-header-cora)"/>
    <text x="810" y="726" font-family="Inter, system-ui, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="15" text-anchor="middle">QUALITY FIRST</text>

    <!-- Avatar -->
    <circle cx="810" cy="970" r="110" fill="#0b64dd"/>
    <text x="770" y="1012" font-family="Inter, system-ui, sans-serif" font-size="112" font-weight="700" fill="#ffffff">C</text>

    <!-- Name -->
    <text x="810" y="1250" font-family="Inter, system-ui, sans-serif" font-size="186" font-weight="800" fill="#1c1e23" text-anchor="middle">Cora</text>
    <!-- Tagline pill -->
    <rect x="390" y="1280" width="840" height="72" rx="36" fill="#0b64dd" opacity="0.1"/>
    <text x="810" y="1330" font-family="Inter, system-ui, sans-serif" font-size="50" font-weight="700" fill="#0b64dd" text-anchor="middle">Quality above everything</text>
    <!-- Sub-label -->
    <text x="810" y="1400" font-family="Inter, system-ui, sans-serif" font-size="44" fill="#5a6068" text-anchor="middle">Legal &amp; Medical Research</text>

    <!-- Divider -->
    <line x1="160" y1="1470" x2="1460" y2="1470" stroke="#0b64dd" stroke-width="5" opacity="0.3"/>

    <!-- Censored list bars -->
    <g filter="url(#censor-blur)">
      <rect x="190" y="1540" width="1060" height="42" rx="6" fill="#4a5568" opacity="0.5"/>
      <rect x="190" y="1630" width="860" height="42" rx="6" fill="#4a5568" opacity="0.45"/>
      <rect x="190" y="1720" width="980" height="42" rx="6" fill="#4a5568" opacity="0.4"/>
    </g>

    <!-- Censored outcome -->
    <g filter="url(#censor-blur)">
      <rect x="160" y="1920" width="1200" height="280" rx="18" fill="#0b64dd" opacity="0.12"/>
      <rect x="280" y="1990" width="440" height="34" rx="6" fill="#0b64dd" opacity="0.5"/>
      <rect x="230" y="2066" width="860" height="44" rx="6" fill="#0b64dd" opacity="0.5"/>
    </g>

    <!-- Extra blurred section below — hints at more content being cut off -->
    <g filter="url(#censor-blur)">
      <rect x="190" y="2370" width="900" height="36" rx="6" fill="#4a5568" opacity="0.25"/>
      <rect x="190" y="2440" width="700" height="36" rx="6" fill="#4a5568" opacity="0.2"/>
      <rect x="190" y="2510" width="1000" height="36" rx="6" fill="#4a5568" opacity="0.15"/>
    </g>
  </g>

  <!-- ==================== CARD: BEN (Yellow) — right, BEHIND ==================== -->
  <g id="card-ben">
    <rect x="3240" y="600" width="1500" height="2300" rx="28" fill="#ffffff" stroke="#fec514" stroke-width="14" filter="url(#shadow-yellow)"/>

    <!-- Header band -->
    <clipPath id="clip-header-ben">
      <rect x="3240" y="600" width="1500" height="175" rx="28"/>
    </clipPath>
    <rect x="3240" y="600" width="1500" height="175" fill="#fec514" clip-path="url(#clip-header-ben)"/>
    <text x="3990" y="726" font-family="Inter, system-ui, sans-serif" font-size="88" font-weight="800" fill="#1c1e23" letter-spacing="15" text-anchor="middle">COST FIRST</text>

    <!-- Avatar -->
    <circle cx="3990" cy="970" r="110" fill="#fec514"/>
    <text x="3953" y="1012" font-family="Inter, system-ui, sans-serif" font-size="112" font-weight="700" fill="#1c1e23">B</text>

    <!-- Name -->
    <text x="3990" y="1250" font-family="Inter, system-ui, sans-serif" font-size="186" font-weight="800" fill="#1c1e23" text-anchor="middle">Ben</text>
    <!-- Tagline pill -->
    <rect x="3580" y="1280" width="820" height="72" rx="36" fill="#fec514" opacity="0.15"/>
    <text x="3990" y="1330" font-family="Inter, system-ui, sans-serif" font-size="50" font-weight="700" fill="#9a7200" text-anchor="middle">Cost as low as possible</text>
    <!-- Sub-label -->
    <text x="3990" y="1400" font-family="Inter, system-ui, sans-serif" font-size="44" fill="#5a6068" text-anchor="middle">Document Archive</text>

    <!-- Divider -->
    <line x1="3340" y1="1470" x2="4640" y2="1470" stroke="#fec514" stroke-width="5" opacity="0.3"/>

    <!-- Censored list bars -->
    <g filter="url(#censor-blur)">
      <rect x="3370" y="1540" width="1060" height="42" rx="6" fill="#4a5568" opacity="0.5"/>
      <rect x="3370" y="1630" width="1100" height="42" rx="6" fill="#4a5568" opacity="0.45"/>
      <rect x="3370" y="1720" width="1160" height="42" rx="6" fill="#4a5568" opacity="0.4"/>
      <rect x="3370" y="1810" width="940" height="42" rx="6" fill="#4a5568" opacity="0.35"/>
    </g>

    <!-- Censored outcome -->
    <g filter="url(#censor-blur)">
      <rect x="3340" y="2010" width="1200" height="280" rx="18" fill="#fec514" opacity="0.1"/>
      <rect x="3460" y="2080" width="440" height="34" rx="6" fill="#9a7200" opacity="0.45"/>
      <rect x="3410" y="2156" width="860" height="44" rx="6" fill="#9a7200" opacity="0.45"/>
    </g>

    <!-- Extra blurred section -->
    <g filter="url(#censor-blur)">
      <rect x="3370" y="2460" width="900" height="36" rx="6" fill="#4a5568" opacity="0.25"/>
      <rect x="3370" y="2530" width="1100" height="36" rx="6" fill="#4a5568" opacity="0.2"/>
    </g>
  </g>

  <!-- ==================== CARD: SAMANTHA (Teal) — center, IN FRONT ==================== -->
  <g id="card-samantha">
    <rect x="1460" y="340" width="1880" height="2600" rx="30" fill="#ffffff" stroke="#48efcf" stroke-width="18" filter="url(#shadow-teal)"/>

    <!-- Header band -->
    <clipPath id="clip-header-sam">
      <rect x="1460" y="340" width="1880" height="210" rx="30"/>
    </clipPath>
    <rect x="1460" y="340" width="1880" height="210" fill="#48efcf" clip-path="url(#clip-header-sam)"/>
    <text x="2400" y="486" font-family="Inter, system-ui, sans-serif" font-size="98" font-weight="800" fill="#0d3d33" letter-spacing="18" text-anchor="middle">SPEED FIRST</text>

    <!-- Avatar -->
    <circle cx="2400" cy="760" r="130" fill="#48efcf"/>
    <text x="2355" y="808" font-family="Inter, system-ui, sans-serif" font-size="130" font-weight="700" fill="#0d3d33">S</text>

    <!-- Name -->
    <text x="2400" y="1080" font-family="Inter, system-ui, sans-serif" font-size="210" font-weight="800" fill="#1c1e23" text-anchor="middle">Samantha</text>
    <!-- Tagline pill -->
    <rect x="1960" y="1115" width="880" height="78" rx="39" fill="#48efcf" opacity="0.15"/>
    <text x="2400" y="1168" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="700" fill="#0a8a72" text-anchor="middle">Speed over perfection</text>
    <!-- Sub-label -->
    <text x="2400" y="1245" font-family="Inter, system-ui, sans-serif" font-size="46" fill="#5a6068" text-anchor="middle">E-commerce Product Search</text>

    <!-- Divider -->
    <line x1="1580" y1="1310" x2="3220" y2="1310" stroke="#48efcf" stroke-width="6" opacity="0.35"/>

    <!-- Censored list bars — 4 items, well-spaced -->
    <g filter="url(#censor-blur)">
      <rect x="1620" y="1390" width="1200" height="46" rx="6" fill="#4a5568" opacity="0.5"/>
      <rect x="1620" y="1486" width="1360" height="46" rx="6" fill="#4a5568" opacity="0.45"/>
      <rect x="1620" y="1582" width="1050" height="46" rx="6" fill="#4a5568" opacity="0.4"/>
      <rect x="1620" y="1678" width="1180" height="46" rx="6" fill="#4a5568" opacity="0.35"/>
    </g>

    <!-- Censored outcome -->
    <g filter="url(#censor-blur)">
      <rect x="1580" y="1880" width="1640" height="300" rx="20" fill="#48efcf" opacity="0.13"/>
      <rect x="1720" y="1960" width="540" height="36" rx="6" fill="#0a8a72" opacity="0.5"/>
      <rect x="1670" y="2044" width="1040" height="48" rx="6" fill="#0a8a72" opacity="0.5"/>
    </g>

    <!-- Extra blurred content below outcome — suggests more is hidden -->
    <g filter="url(#censor-blur)">
      <rect x="1620" y="2360" width="1100" height="40" rx="6" fill="#4a5568" opacity="0.22"/>
      <rect x="1620" y="2440" width="900" height="40" rx="6" fill="#4a5568" opacity="0.18"/>
      <rect x="1620" y="2520" width="1200" height="40" rx="6" fill="#4a5568" opacity="0.14"/>
      <rect x="1620" y="2600" width="800" height="40" rx="6" fill="#4a5568" opacity="0.1"/>
    </g>
  </g>

  <!-- ==================== VS diamonds — ON TOP ==================== -->
  <g filter="url(#diamond-glow)">
    <rect x="1382" y="1440" width="130" height="130" rx="14" fill="#1a1f2e" stroke="#ffffff" stroke-width="5" transform="rotate(45, 1447, 1505)"/>
    <text x="1447" y="1526" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle">VS</text>
  </g>
  <g filter="url(#diamond-glow)">
    <rect x="3268" y="1440" width="130" height="130" rx="14" fill="#1a1f2e" stroke="#ffffff" stroke-width="5" transform="rotate(45, 3333, 1505)"/>
    <text x="3333" y="1526" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle">VS</text>
  </g>
</svg>
