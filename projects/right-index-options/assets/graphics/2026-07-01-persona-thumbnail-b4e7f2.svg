<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 4800 2700" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <path fill="#f0f3f8" stroke="none" d="M 0 0 L 4800 0 L 4800 2700 L 0 2700 Z"/>

  <defs>
    <!-- Heavy blur for censoring text -->
    <filter id="censor-blur" x="0" y="0" width="4800" height="2700" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <!-- Drop shadow for the frosted censor panels -->
    <filter id="panel-shadow" x="0" y="0" width="4800" height="2700" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="blur"/>
      <feOffset dx="0" dy="14" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.28"/>
      <feComposite in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

