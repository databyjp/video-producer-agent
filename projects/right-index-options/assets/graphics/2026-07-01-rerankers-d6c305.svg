<?xml version="1.0" encoding="UTF-8"?>
<svg width="1350" height="1350" viewBox="0 0 1350 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#5a6068" stroke-width="0.6" opacity="0.12"/>
    </pattern>
    <!-- Card shadow filter -->
    <filter id="shadow-card" x="-5%" y="-8%" width="115%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7.2"/>
      <feOffset dx="2.4" dy="4.8" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.18"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1350" height="1350" fill="#F0F3F8"/>
  <rect width="1350" height="1350" fill="url(#grid)"/>

  <!-- Title -->
  <text x="60" y="102" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" fill="#1C1E23" letter-spacing="-1.5">Rerankers</text>
  <text x="60" y="148" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="29" fill="#5A6068">What they are, and why they matter</text>

  <!-- Main card (with shadow) -->
  <rect x="60" y="175" width="1230" height="900" rx="12" fill="white" stroke="#8B95A5" stroke-width="2.4" filter="url(#shadow-card)"/>

  <!-- Tab background (overlapping card top edge) -->
  <rect x="60" y="162" width="295" height="46" rx="8" fill="white" stroke="#8B95A5" stroke-width="2.0"/>
  <!-- Tab coral accent strip (top) -->
  <rect x="60" y="162" width="295" height="9" rx="5" fill="#FF957D"/>
  <rect x="60" y="169" width="295" height="4" fill="#FF957D"/>
  <!-- Tab label -->
  <text x="78" y="200" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1C1E23" letter-spacing="2.8">RERANKING</text>

  <!-- Horizontal divider below tab zone -->
  <line x1="80" y1="253" x2="1270" y2="253" stroke="#D3DAE6" stroke-width="1.5"/>

  <!-- ─────────────────────────────── -->
  <!-- ROW 1: EMBEDDING MODELS         -->
  <!-- ─────────────────────────────── -->
  <!-- Colored side bar -->
  <rect x="80" y="275" width="8" height="85" rx="4" fill="#5A6068"/>
  <!-- Label -->
  <text x="106" y="301" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#5A6068" letter-spacing="2.2">EMBEDDING MODELS</text>
  <!-- Body -->
  <text x="106" y="342" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1C1E23">Query &amp; doc: never see each other</text>

  <!-- Row separator -->
  <line x1="80" y1="385" x2="1270" y2="385" stroke="#D3DAE6" stroke-width="1.0"/>

  <!-- ─────────────────────────────── -->
  <!-- ROW 2: RERANKERS               -->
  <!-- ─────────────────────────────── -->
  <rect x="80" y="405" width="8" height="85" rx="4" fill="#FF957D"/>
  <text x="106" y="432" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF957D" letter-spacing="2.2">RERANKERS</text>
  <text x="106" y="474" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1C1E23">Read query + doc together</text>

  <!-- Row separator -->
  <line x1="80" y1="515" x2="1270" y2="515" stroke="#D3DAE6" stroke-width="1.0"/>

  <!-- ─────────────────────────────── -->
  <!-- ROW 3: RESULT                  -->
  <!-- ─────────────────────────────── -->
  <rect x="80" y="535" width="8" height="85" rx="4" fill="#36B37E"/>
  <text x="106" y="562" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#36B37E" letter-spacing="2.2">RESULT</text>
  <text x="106" y="604" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1C1E23">More accurate relevance scores</text>

  <!-- Row separator -->
  <line x1="80" y1="645" x2="1270" y2="645" stroke="#D3DAE6" stroke-width="1.0"/>

  <!-- ─────────────────────────────── -->
  <!-- ROW 4: HOW TO USE              -->
  <!-- ─────────────────────────────── -->
  <rect x="80" y="665" width="8" height="85" rx="4" fill="#0B64DD"/>
  <text x="106" y="692" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0B64DD" letter-spacing="2.2">HOW TO USE</text>
  <text x="106" y="734" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1C1E23">2nd stage after initial retrieval</text>

  <!-- ─────────────────────────────── -->
  <!-- KEY CALLOUT (bottom of card)   -->
  <!-- ─────────────────────────────── -->
  <line x1="80" y1="775" x2="1270" y2="775" stroke="#D3DAE6" stroke-width="1.5"/>

  <!-- Callout box -->
  <rect x="80" y="800" width="1170" height="80" rx="10" fill="#F8F9FC" stroke="#D3DAE6" stroke-width="1.5"/>
  <text x="105" y="832" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#5A6068" letter-spacing="1.5">ALSO CALLED</text>
  <text x="105" y="863" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#0B64DD">cross-encoder</text>
  <text x="320" y="863" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" fill="#5A6068"> model — sees query &amp; doc jointly</text>

  <!-- ─────────────────────────────── -->
  <!-- FOOTER INSIDE CARD             -->
  <!-- ─────────────────────────────── -->
  <line x1="80" y1="915" x2="1270" y2="915" stroke="#D3DAE6" stroke-width="1.5"/>
  <text x="80" y="965" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#98A2B3" letter-spacing="1.5">PERFORMANCE</text>
  <text x="80" y="994" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" fill="#3D4250">Embedding retrieval</text>
  <text x="500" y="994" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#FF957D">  →  </text>
  <text x="550" y="994" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" fill="#3D4250">Reranker rescores top results</text>
  <text x="80" y="1032" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" fill="#3D4250">Adds latency, but significant uplift in recall quality</text>

  <!-- ─────────────────────────────── -->
  <!-- ELASTIC LOGO BADGE             -->
  <!-- ─────────────────────────────── -->
  <rect x="1090" y="1123" width="200" height="55" rx="9" fill="#F0F3F8" stroke="#FEC514" stroke-width="4"/>
  <!-- Elastic wordmark (simplified "elastic" text) -->
  <text x="1105" y="1159" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#1C1E23">elastic</text>
</svg>
