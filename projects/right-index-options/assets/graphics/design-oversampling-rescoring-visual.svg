    <text xml:space="preserve" x="1815" y="758" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#1c1e23" text-anchor="middle">10</text>

    <!-- ======================== -->
    <!-- BOTTOM KEY CALLOUT      -->
    <!-- ======================== -->
    <text xml:space="preserve" x="69" y="1050" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#1c1e23">3× oversampling</text>
    <text xml:space="preserve" x="69" y="1100" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="34" fill="#5a6068">Retrieve 3× more candidates than needed, then rescore to pick the best.</text>
    <text xml:space="preserve" x="69" y="1148" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="34" fill="#5a6068">Compressed search is fast but approximate — rescoring against full-precision</text>
    <text xml:space="preserve" x="69" y="1196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="34" fill="#5a6068">vectors recovers the accuracy lost during quantization.</text>

