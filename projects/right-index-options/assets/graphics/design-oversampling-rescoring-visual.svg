    <!-- Stage 1 title -->
    <text xml:space="preserve" x="420" y="420" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#1c1e23">Fast Search</text>
    <text xml:space="preserve" x="420" y="468" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="34" fill="#5a6068">Search the quantized index</text>
    <text xml:space="preserve" x="420" y="510" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="34" fill="#5a6068">using compressed vectors.</text>

    <!-- Data source label -->
