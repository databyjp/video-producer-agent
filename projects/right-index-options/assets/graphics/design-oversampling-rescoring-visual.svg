    <polygon points="340,488 364,500 340,512" fill="#98A2B3"/>

    <!-- ======================== -->
    <!-- STAGE 1 CARD            -->
    <!-- ======================== -->
    <defs>
        <filter id="shadow1" x="-5%" y="-5%" width="115%" height="120%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="12.8" in="SourceAlpha" result="blur"/>
            <feOffset dx="4.3" dy="8.5" in="blur" result="offsetblur"/>
            <feFlood flood-color="#000000" flood-opacity="0.18"/>
            <feComposite in2="offsetblur" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="shadow2" x="-5%" y="-5%" width="115%" height="120%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="12.8" in="SourceAlpha" result="blur"/>
            <feOffset dx="4.3" dy="8.5" in="blur" result="offsetblur"/>
            <feFlood flood-color="#000000" flood-opacity="0.18"/>
            <feComposite in2="offsetblur" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Stage 1 card body -->
    <rect x="380" y="330" width="750" height="580" rx="20" fill="#ffffff" stroke="#FEC514" stroke-width="4.3" filter="url(#shadow1)"/>

