    <text xml:space="preserve" x="69" y="232" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" fill="#5a6068">How quantized vector search recovers quality</text>

    <!-- ======================== -->
    <!-- QUERY INPUT (left side) -->
    <!-- ======================== -->
    <!-- Query pill -->
    <rect x="69" y="460" width="200" height="80" rx="40" fill="#0b64dd" stroke="none"/>
    <text xml:space="preserve" x="169" y="510" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">Query</text>

